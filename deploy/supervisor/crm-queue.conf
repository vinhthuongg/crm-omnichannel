[program:crm-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/crm-omnichannel/artisan queue:work --queue=outbound,default --sleep=1 --tries=3 --timeout=120 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/crm-omnichannel/storage/logs/queue-worker.log
stopwaitsecs=3600
